<!-- Hero Section matching heera/Hero.jsx typography exactly -->
<section id="home" class="hero-container">
  <style>
    .hero-container {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      max-height: 1100px;
      overflow: hidden;
      background-color: #0F172A;
      display: block;
      margin-top: 0;
    }

    .hero-slider-desktop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      z-index: 1;
    }

    .hero-slider-mobile {
      display: none;
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0F172A;
      overflow: hidden;
      z-index: 1;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: opacity 1.2s ease-in-out;
    }

    @keyframes heroZoomInOut {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .desktop-hero-image {
      animation: heroZoomInOut 15s ease-in-out infinite;
      transform-origin: center center;
      will-change: transform;
    }

    /* Content block — sits over the image */
    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 30;
      padding: 80px 80px 24px 44px;
      width: 100%;
      max-width: 800px;
      background: radial-gradient(
        100% 100% at 0% 100%,
        rgba(0, 0, 0, 0.95) 0%,
        rgba(0, 0, 0, 0.7) 55%,
        rgba(0, 0, 0, 0.2) 75%,
        transparent 90%
      );
      pointer-events: auto;
    }

    /* Main title */
    .hero-title {
      font-family: var(--font-jost), Montserrat, sans-serif;
      font-size: clamp(20px, 3vw, 40px);
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.08;
      margin: 0 0 6px;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
    }

    /* Subtitle */
    .hero-subtitle {
      font-family: var(--font-jost), Montserrat, sans-serif;
      font-size: clamp(11px, 1.4vw, 18px);
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 12px;
      opacity: 0.92;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
    }

    .hero-subtitle span {
      font-size: 0.9em;
      font-weight: 600;
      text-transform: none;
      color: #fff;
    }

    /* Bullets */
    .hero-bullets {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-bullet-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-bullet-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      background-color: #fff;
      border-radius: 50%;
      padding: 2px;
      stroke: var(--color-brand, #C9A96E);
    }

    .hero-bullet-text {
      color: #fff;
      font-family: var(--font-sans), Open Sans, sans-serif;
      font-size: clamp(13px, 1.5vw, 18px);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* Price line */
    .hero-price-line {
      font-family: var(--font-sans), Open Sans, sans-serif;
      font-size: clamp(13px, 1.5vw, 18px);
      color: rgba(255, 255, 255, 0.88);
      margin: 0 0 0px;
      line-height: 1.4;
    }

    @keyframes heroPriceBlink {
      0%, 75% { 
        opacity: 1; 
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
      }
      76%, 100% { 
        opacity: 0; 
        text-shadow: none; 
      }
    }

    .hero-price-amt {
      font-family: var(--font-jost), Montserrat, sans-serif;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      color: #fff;
      animation: heroPriceBlink 1.4s infinite;
      display: inline-block;
      line-height: 1;
      vertical-align: baseline;
    }

    /* CTA Row */
    .hero-cta-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .hero-btn-pill {
      border-radius: 50px !important;
      -webkit-mask: none !important;
      mask: none !important;
    }

    .hero-btn-one {
      color: #fff !important;
      border: 1.5px solid rgba(255, 255, 255, 0.9) !important;
      background: transparent !important;
      font-size: 14px !important;
      padding: 11px 24px !important;
      font-weight: 700 !important;
      text-transform: none !important;
      cursor: pointer !important;
      display: inline-block !important;
      transition: all 0.3s ease !important;
      text-decoration: none !important;
    }
    .hero-btn-one:hover {
      background: var(--color-brand, #C9A96E) !important;
      color: #fff !important;
      border-color: var(--color-brand, #C9A96E) !important;
    }

    .hero-btn-two {
      background: var(--color-brand, #C9A96E) !important;
      color: #111827 !important;
      border: 1.5px solid var(--color-brand, #C9A96E) !important;
      font-size: 12px !important;
      padding: 11px 22px !important;
      font-weight: 800 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      cursor: pointer !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      transition: all 0.3s ease !important;
      text-decoration: none !important;
    }
    .hero-btn-two:hover {
      background: #ffffff !important;
      border-color: #ffffff !important;
      color: #000242 !important;
    }

    @media (min-width: 1024px) {
      .hero-content {
        padding: 80px 80px 32px 48px !important;
      }
    }

    /* Compact Laptops (MacBook 13", ASUS, 720p/768p) */
    @media (min-width: 1024px) and (max-height: 760px) {
      .hero-content {
        padding: 70px 60px 20px 48px !important;
      }
      .hero-bullets {
        margin-bottom: 14px !important;
        gap: 6px !important;
      }
      .hero-price-line {
        margin-bottom: 16px !important;
      }
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      .hero-container {
        height: 75vh;
        min-height: 550px;
      }
      .hero-content {
        padding: 0 28px 46px !important;
      }
    }

    @media (max-width: 767px) {
      .hero-container {
        display: flex !important;
        flex-direction: column !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        background: #0F172A !important;
        padding-top: 56px !important;
        overflow: visible !important;
      }
      .hero-slider-desktop {
        display: none !important;
      }
      .hero-slider-mobile {
        display: block !important;
      }
      .hero-content {
        position: relative !important;
        background: #0F172A !important;
        padding: 24px 20px 28px !important;
        z-index: 30 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      .hero-title {
        color: #C9A65A !important;
        text-shadow: none !important;
        font-size: 24px !important;
      }
      .hero-subtitle,
      .hero-price-line,
      .hero-price-amt,
      .hero-bullet-text {
        color: #ffffff !important;
        text-shadow: none !important;
      }
      .hero-subtitle {
        font-size: 16px !important;
      }
      .hero-price-line {
        font-size: 17px !important;
      }
      .hero-bullet-item svg {
        background-color: rgba(255, 255, 255, 0.1) !important;
        stroke: #C9A65A !important;
      }
      .hero-cta-row {
        flex-direction: column !important;
        align-items: center !important;
        gap: 12px !important;
        width: 100%;
      }
      .hero-cta-row > button {
        width: 100% !important;
        justify-content: center !important;
        text-align: center;
        padding: 12px 10px !important;
        font-size: 14px !important;
        white-space: normal !important;
        box-shadow: none !important;
      }
      .hero-btn-two {
        background: #C9A65A !important;
        color: #111827 !important;
        border-color: transparent !important;
        font-weight: 800 !important;
      }
      .hero-btn-one {
        color: #ffffff !important;
        border-color: #ffffff !important;
        background: transparent !important;
      }
    }
  </style>

  <!-- Image Banner Carousel (Desktop & Tablet) -->
  <div class="hero-slider-desktop">
    <img
      id="hero-desk-slide-0"
      src="images/hero/banner1.webp"

    <img

  <!-- Image Banner Carousel (Mobile Devices) -->
  <div class="hero-slider-mobile">
    <img
      id="hero-mob-slide-0"
      src="images/hero/banner1.webp"

    <img

  <!-- Content Overlay: Bottom-Left Alignment -->
  <div class="hero-content">

    <h1 class="hero-title">

    <!-- Subtitle -->

    <!-- Bullet Points -->
    <div class="hero-bullets">
      <div class="hero-bullet-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-brand, #C9A96E)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

        </svg>

        </span>
      </div>

      <div class="hero-bullet-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-brand, #C9A96E)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span class="hero-bullet-text">
          New Launch 2, 3 &amp; 4 BHK Apartments
        </span>
      </div>

      <div class="hero-bullet-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-brand, #C9A96E)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span class="hero-bullet-text">
          Located on Pune IT &amp; Growth Corridor
        </span>
      </div>

      <div class="hero-bullet-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-brand, #C9A96E)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span class="hero-bullet-text">
          At Hinjewadi Phase 3, Pune
        </span>
      </div>
    </div>

    <!-- Price Line -->
    <p class="hero-price-line">
      Luxurious 2, 3 &amp; 4 BHK Flats
      <span style="margin-left: 6px; margin-right: 6px;">From</span>
      <span class="hero-price-amt">₹ 79.99 Lacs*</span>
      <span style="margin-left: 6px; margin-right: 6px;">Onwards</span>
    </p>

    <!-- CTA Row -->
    <div class="hero-cta-row">
      <button
        type="button"
        data-bs-toggle="modal"
        data-bs-target="#leadModal"
        class="hero-btn-one hero-btn-pill"
      >
        Download Brochure
      </button>

      <button
        type="button"
        data-bs-toggle="modal"
        data-bs-target="#leadModal"
        class="hero-btn-two hero-btn-pill"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Schedule Site Visit
      </button>
    </div>

  </div>
</section>
