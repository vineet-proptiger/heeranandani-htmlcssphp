<!-- Mobile Sticky Bottom Bar (Exact replica with self-contained CSS) -->
<style>
  .sticky-bottom-bar-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 99999;
    background-color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    gap: 12px;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
    box-sizing: border-box;
  }
  @media (min-width: 992px) {
    .sticky-bottom-bar-container {
      display: none !important;
    }
  }

  /* Big Enquire Button */
  .mobile-enquire-btn {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    border-radius: 50px;
    background: linear-gradient(135deg, #d8be8d 0%, #b89552 100%);
    color: #13192b;
    border: none;
    outline: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(201, 169, 110, 0.25);
    transition: transform 0.2s;
    text-decoration: none;
    box-sizing: border-box;
    height: 50px;
  }
  .mobile-enquire-btn:active {
    transform: scale(0.98);
  }
  .mobile-enquire-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .mobile-enquire-btn span {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-family: 'Open Sans', var(--font-sans), sans-serif;
    text-transform: uppercase;
    line-height: 1;
  }

  /* Contact Actions Group */
  .mobile-actions-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  /* Circular Action Buttons (Call & WhatsApp) */
  .mobile-circle-btn {
    width: 50px;
    height: 50px;
    min-width: 50px;
    min-height: 50px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-decoration: none;
    flex-shrink: 0;
    box-sizing: border-box;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    transition: transform 0.2s;
  }
  .mobile-circle-btn:active {
    transform: scale(0.95);
  }
  .mobile-circle-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .mobile-circle-btn span {
    font-size: 7.5px;
    font-weight: 700;
    font-family: 'Open Sans', var(--font-sans), sans-serif;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1;
    margin: 0;
  }

  /* Call Button */
  .mobile-call-btn {
    background-color: #1e293b;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* WhatsApp Button */
  .mobile-wa-btn {
    background-color: #2cd36f;
    color: #ffffff;
    border: none;
  }
</style>
