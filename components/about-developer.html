<!-- Section 8: Get In Touch / Book Site Visit Today matching heera/AboutDeveloper.jsx and media_1791806612466_8f22b118.png -->
<section 
  id="developer" 
  class="relative py-16 sm:py-24 bg-fixed bg-cover bg-center border-b border-gray-100" 
  style="
    background-image: url('images/about-devloper/about-dev.webp'); 
    background-position: center; 
    background-size: cover; 
    background-repeat: no-repeat;
    position: relative;
  "
>
  <!-- Background Overlay for optimal contrast -->
  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.28); pointer-events: none; z-index: 1;"></div>

  <style>
    .getintouch-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
      box-sizing: border-box;
    }

    .getintouch-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: stretch;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 991px) {
      .getintouch-grid {
        grid-template-columns: 1fr;
        max-width: 540px;
        gap: 28px;
      }
    }

    /* Left Card: Frosted Dark Card */
    .getintouch-left-card {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 44px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      box-sizing: border-box;
    }

    .getintouch-title {
      font-family: var(--font-jost), 'Montserrat', sans-serif;
      font-size: clamp(26px, 3.2vw, 38px);
      font-weight: 700;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #ffffff;
      margin: 0 0 12px 0;
    }

    .getintouch-divider {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin: 6px 0 24px 0;
    }
    .getintouch-divider-line {
      width: 50px;
      height: 1.5px;
      background-color: #7d9b93;
    }
    .getintouch-divider-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #7d9b93;
      margin: 0 10px;
    }

    .getintouch-desc {
      font-family: 'Open Sans', var(--font-sans), sans-serif;
      font-size: 18px;
      line-height: 1.65;
      font-weight: 400;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      max-width: 440px;
    }

    /* Right Card: Glassmorphism Form */
    .getintouch-right-card {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    .getintouch-form-header {
      background: #000242;
      padding: 20px 28px;
      position: relative;
      overflow: hidden;
    }
    .getintouch-form-gold-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #c28522, #d8be8d);
    }
    .getintouch-form-heading {
      font-family: var(--font-jost), 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: #ffffff;
      margin: 0 0 4px 0;
      letter-spacing: -0.01em;
    }
    .getintouch-form-subheading {
      font-family: 'Open Sans', var(--font-sans), sans-serif;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      margin: 0;
    }

    .getintouch-form-body {
      padding: 24px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background: transparent !important;
    }

    #developer #aboutDevLeadForm.rs-lead-form,
    #developer form.rs-lead-form {
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
      border-radius: 0 !important;
      width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 16px !important;
    }

    .getintouch-form-group {
      margin-bottom: 0 !important;
    }
    .getintouch-label {
      display: block !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      font-family: var(--font-jost), 'Montserrat', sans-serif !important;
      letter-spacing: 0.06em !important;
      text-transform: uppercase !important;
      margin-bottom: 5px !important;
    }
    .getintouch-input {
      width: 100% !important;
      padding: 12px 14px !important;
      border-radius: 6px !important;
      font-size: 14px !important;
      color: #111827 !important;
      background-color: #ffffff !important;
      border: 1px solid #d1d5db !important;
      box-sizing: border-box !important;
      outline: none !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
      font-family: 'Open Sans', var(--font-sans), sans-serif !important;
      box-shadow: none !important;
    }
    .getintouch-input:focus {
      border-color: #000242 !important;
      box-shadow: 0 0 0 3px rgba(0, 2, 66, 0.15) !important;
    }
    .getintouch-input::placeholder {
      color: #9ca3af !important;
    }

    .getintouch-checkbox-row {
      display: flex !important;
      align-items: flex-start !important;
      gap: 10px !important;
      cursor: pointer !important;
      margin-top: 4px !important;
      margin-bottom: 4px !important;
    }
    .getintouch-checkbox-row input {
      accent-color: #c28522 !important;
      margin-top: 2px !important;
      flex-shrink: 0 !important;
      width: 15px !important;
      height: 15px !important;
    }
    .getintouch-checkbox-text {
      font-size: 12px !important;
      color: #ffffff !important;
      font-family: 'Open Sans', var(--font-sans), sans-serif !important;
      line-height: 1.5 !important;
    }

    .getintouch-submit-btn {
      width: 100% !important;
      padding: 14px 24px !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      background-color: #000242 !important;
      color: #ffffff !important;
      border: 1px solid #000242 !important;
      border-radius: 4px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      cursor: pointer !important;
      transition: all 0.3s ease !important;
      font-family: var(--font-jost), 'Montserrat', sans-serif !important;
      margin-top: 4px !important;
    }
    .getintouch-submit-btn:hover {
      background-color: #ffffff !important;
      color: #000242 !important;
    }
  </style>

  <div class="getintouch-container">
    <div class="getintouch-grid">

      <!-- Left — Get In Touch Text Card -->
      <div 
        class="getintouch-left-card"
        data-aos="fade-right" 
        data-aos-duration="1000" 
        data-aos-delay="100"
      >
        <h2 class="getintouch-title">
          GET IN TOUCH
        </h2>
        
        <!-- Decorative Line -->
        <div class="getintouch-divider">
          <div class="getintouch-divider-line"></div>
          <div class="getintouch-divider-dot"></div>
          <div class="getintouch-divider-line"></div>
        </div>

        <p class="getintouch-desc">
          Take the first step toward luxury living. Connect with our specialists for the latest pricing, floor plans, payment plans, and priority booking assistance.
        </p>
      </div>

      <!-- Right — Contact Form -->
      <div 
        class="getintouch-right-card"
        data-aos="fade-left" 
        data-aos-duration="1000" 
        data-aos-delay="200"
      >
        <!-- Form Header -->
        <div class="getintouch-form-header">
          <div class="getintouch-form-gold-bar"></div>
          <h3 class="getintouch-form-heading">
            Book Site Visit Today
          </h3>
          <p class="getintouch-form-subheading">
            Register now to get the best deal &amp; book your site visit
          </p>
        </div>

        <!-- Form Body -->
        <div class="getintouch-form-body">
          <form
            id="aboutDevLeadForm"
            class="rs-lead-form needs-validation"
            method="POST"
            action="/submit-lead"
            data-endpoint="/submit-lead"
            novalidate
            onsubmit="return window.RSLeadSubmit ? RSLeadSubmit(this, event) : true;"
          >
            <!-- Full Name -->
            <div class="getintouch-form-group">
              <label class="getintouch-label">
                Full Name <span style="color: #d8be8d;">*</span>
              </label>
              <input
                type="text"
                name="fullname"
                required
                placeholder="Enter full name"
                class="getintouch-input"
              />
            </div>

            <!-- Email Address -->
            <div class="getintouch-form-group">
              <label class="getintouch-label">
                Email Address
              </label>
              <input
                type="email"
                name="email"
                placeholder="Email Id (optional)"
                class="getintouch-input"
              />
            </div>

            <!-- Mobile Number -->
            <div class="getintouch-form-group">
              <label class="getintouch-label">
                Mobile Number <span style="color: #d8be8d;">*</span>
              </label>
              <input
                type="tel"
                name="phone"
                required
                placeholder="10-digit mobile number"
                maxlength="10"
                pattern="^[6-9][0-9]{9}$"
                class="getintouch-input"
              />
            </div>

            <div class="small text-white text-center" data-form-message></div>

            <!-- Checkbox -->
            <label class="getintouch-checkbox-row">
              <input
                type="checkbox"
                required
                checked
              />
              <span class="getintouch-checkbox-text">
                I authorize the developer &amp; its representatives to contact me via Email / SMS / WhatsApp / Call.
              </span>
            </label>

            <!-- Submit Button -->
            <button
              type="submit"
              class="getintouch-submit-btn"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              SUBMIT DETAILS
            </button>

            <!-- Hidden Fields for API Integration -->
            <input type="hidden" name="form_name" value="Developer Section Form" />
            <input type="hidden" name="country" value="india" />
            <input type="hidden" name="utm_source" />
            <input type="hidden" name="utm_medium" />
            <input type="hidden" name="utm_campaign" />
            <input type="hidden" name="utm_term" />
            <input type="hidden" name="utm_content" />
            <input type="hidden" name="gclid" />
            <input type="hidden" name="gbraid" />
            <input type="hidden" name="wbraid" />
            <input type="hidden" name="fbclid" />
            <input type="hidden" name="device" />
            <input type="hidden" name="referrer" />
            <input type="hidden" name="Ipaddress" />
            <input type="hidden" name="landing_page" />
            <input type="hidden" name="projectId" />
            <input type="hidden" name="city" />
            <input type="hidden" name="projectName" />
          </form>
        </div>
      </div>

    </div>
  </div>
</section>
